# ======================================================================
# API under test
# ======================================================================
baseUri=https://reqres.in
basePath=/api
environment=qa

# ======================================================================
# Authentication
#
# reqres.in requires a personal API key on every endpoint. Create one at
# app.reqres.in/api-keys and either set it here or pass it at run time:
#
#   mvn test -DapiKey=<your-key>
#
# Without a key every request returns 401 missing_api_key.
# ======================================================================
apiKeyHeader=x-api-key
apiKey=

# ======================================================================
# Timeouts (milliseconds)
# ======================================================================
connectTimeout=30000
readTimeout=30000

# ======================================================================
# Response expectations
# maxResponseTimeMillis feeds the shared response specification
# ======================================================================
maxResponseTimeMillis=10000
expectedContentType=JSON

# ======================================================================
# Logging
# logRequests / logResponses: always | onFailure | off
# ======================================================================
logRequests=always
logResponses=always
logDir=test-results

reportsDir=reports
