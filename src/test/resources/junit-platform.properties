# ======================================================================
# Cucumber / JUnit Platform execution settings
#
# API scenarios have no browser to isolate, so parallel execution is cheap
# and safe here: TestContext is scoped per scenario by PicoContainer and
# nothing is shared statically.
# ======================================================================

cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=8

# Fail the build on undefined or pending steps rather than reporting a pass.
cucumber.execution.strict=true

cucumber.snippet-type=camelcase
